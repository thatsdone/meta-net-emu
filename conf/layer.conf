# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-net-emu"
BBFILE_PATTERN_meta-net-emu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-net-emu = "6"

LAYERDEPENDS_meta-net-emu = "core"
LAYERSERIES_COMPAT_meta-net-emu = "scarthgap"
